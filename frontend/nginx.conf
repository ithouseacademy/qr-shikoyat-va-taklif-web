server {
  listen ${PORT};
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  location /api/ { proxy_pass ${BACKEND_URL}; proxy_set_header Host $proxy_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /media/ { proxy_pass ${BACKEND_URL}; proxy_set_header Host $proxy_host; }
  location /ws/ { proxy_pass ${BACKEND_URL}; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $proxy_host; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
