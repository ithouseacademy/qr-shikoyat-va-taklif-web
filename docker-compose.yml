services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: qrfeedback, POSTGRES_USER: qrfeedback, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qrfeedback}" }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: qrfeedback
      POSTGRES_USER: qrfeedback
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qrfeedback}"
      REDIS_URL: "redis://redis:6379/0"
      USE_SQLITE: "0"
      CELERY_EAGER: "0"
    volumes: [media:/app/media]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: sh start.sh worker
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: qrfeedback
      POSTGRES_USER: qrfeedback
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qrfeedback}"
      REDIS_URL: "redis://redis:6379/0"
      USE_SQLITE: "0"
      CELERY_EAGER: "0"
    volumes: [media:/app/media]
    depends_on: [db, redis]
  beat:
    build: ./backend
    command: sh start.sh beat
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: qrfeedback
      POSTGRES_USER: qrfeedback
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qrfeedback}"
      REDIS_URL: "redis://redis:6379/0"
      USE_SQLITE: "0"
    depends_on: [db, redis]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "" }
    ports: ["80:80"]
    depends_on: [backend]
volumes: { pgdata: {}, media: {} }
